name: Release Plugin

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      notes_heading: ${{ steps.release.outputs.notes_heading }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      target_branch: ${{ steps.release.outputs.target_branch }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release target
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          base_version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ -z "${base_version}" ]]; then
            echo "gradle.properties does not define a version." >&2
            exit 1
          fi

          stable_version='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "${base_version}" =~ ${stable_version} ]]; then
            echo "Version ${base_version} is not a stable SemVer base version." >&2
            echo "Keep gradle.properties in X.Y.Z format (for example, 1.0.0)." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            target_branch="main"
            channel="default"
            notes_heading="${base_version}"
            prerelease="false"
            version="${base_version}"
          elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            target_branch="develop"
            channel="staging"
            notes_heading="Unreleased"
            prerelease="true"

            git fetch --force --tags origin

            latest_rc=0
            while IFS= read -r existing_tag; do
              rc_number="${existing_tag#v${base_version}-rc.}"
              if [[ "${rc_number}" =~ ^(0|[1-9][0-9]*)$ ]] \
                && (( rc_number > latest_rc )); then
                latest_rc="${rc_number}"
              fi
            done < <(git tag --list "v${base_version}-rc.*")

            version="${base_version}-rc.$((latest_rc + 1))"
          else
            echo "Unsupported release branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          tag="v${version}"

          should_release="true"
          if gh release view "${tag}" --json isDraft --jq '.isDraft' \
            > "${RUNNER_TEMP}/release-is-draft" 2>/dev/null; then
            if [[ "$(< "${RUNNER_TEMP}/release-is-draft")" == "false" ]]; then
              should_release="false"
              echo "Release ${tag} already exists; publication will be skipped."
            fi
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "target_branch=${target_branch}"
            echo "channel=${channel}"
            echo "notes_heading=${notes_heading}"
            echo "prerelease=${prerelease}"
            echo "should_release=${should_release}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate changelog entry
        if: steps.release.outputs.should_release == 'true'
        env:
          NOTES_HEADING: ${{ steps.release.outputs.notes_heading }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v heading="## [${NOTES_HEADING}]" '
            index($0, heading) == 1 {
              suffix = substr($0, length(heading) + 1)
              if (suffix == "" || suffix ~ /^ - /) {
                found = 1
                capture = 1
                next
              }
            }
            capture && /^## \[/ { exit }
            capture { print }
            END { if (!found) exit 42 }
          ' CHANGELOG.md > "${notes_file}" || {
            echo "CHANGELOG.md has no section for ${NOTES_HEADING}." >&2
            exit 1
          }

          if ! grep -q '[^[:space:]]' "${notes_file}"; then
            echo "The CHANGELOG.md section for ${NOTES_HEADING} is empty." >&2
            exit 1
          fi

  release:
    name: Release ${{ needs.prepare.outputs.version }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      NOTES_HEADING: ${{ needs.prepare.outputs.notes_heading }}
      PUBLISH_CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v heading="## [${NOTES_HEADING}]" '
            index($0, heading) == 1 {
              suffix = substr($0, length(heading) + 1)
              if (suffix == "" || suffix ~ /^ - /) {
                capture = 1
                next
              }
            }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "${notes_file}"

          echo "notes_file=${notes_file}" >> "${GITHUB_ENV}"

      - name: Run tests and plugin verification
        shell: bash
        run: >-
          bash gradlew
          check
          verifyPluginProjectConfiguration
          verifyPlugin
          -Pversion="${VERSION}"
          --stacktrace

      - name: Sign plugin
        id: package
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for secret_name in CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Required secret ${secret_name} is not configured." >&2
              exit 1
            fi
          done

          bash gradlew signPlugin -Pversion="${VERSION}" --stacktrace

          archive="$(find build/distributions -maxdepth 1 -type f \
            -name '*-signed.zip' -print -quit)"
          if [[ -z "${archive}" ]]; then
            echo "The signed plugin archive was not produced." >&2
            exit 1
          fi

          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          release_args=(
            "${TAG}"
            "${ARCHIVE}"
            --draft
            --target "${GITHUB_SHA}"
            --title "${TAG}"
            --notes-file "${notes_file}"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --draft=true \
              --prerelease="${PRERELEASE}" \
              --title "${TAG}" \
              --notes-file "${notes_file}"
            gh release upload "${TAG}" "${ARCHIVE}" --clobber
          else
            gh release create "${release_args[@]}"
          fi

      - name: Configure Marketplace release channel
        shell: bash
        run: |
          set -euo pipefail

          init_script="${RUNNER_TEMP}/marketplace-channel.gradle"
          printf '%s\n' \
            'allprojects {' \
            '    tasks.configureEach { task ->' \
            '        if (task.name == "publishPlugin") {' \
            '            task.channels.set([System.getenv("PUBLISH_CHANNEL")])' \
            '        }' \
            '    }' \
            '}' > "${init_script}"

          echo "marketplace_init_script=${init_script}" >> "${GITHUB_ENV}"

      - name: Publish plugin to Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: >-
          bash gradlew
          publishPlugin
          -I "${marketplace_init_script}"
          -Pversion="${VERSION}"
          --stacktrace

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release edit "${TAG}" \
            --draft=false \
            --prerelease="${PRERELEASE}"
